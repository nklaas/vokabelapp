# Pings the Supabase database every 3 days so the free project never pauses
# (free projects pause after 7 days without activity).
# Needs two repository secrets: SUPABASE_URL and SUPABASE_KEY (the publishable key).
name: Keep Supabase awake

on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch: # allows a manual run from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query the database
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          # Runs a real (empty, because not logged in) query against the database.
          curl --fail --silent --show-error \
            "$SUPABASE_URL/rest/v1/clusters?select=id&limit=1" \
            -H "apikey: $SUPABASE_KEY"
